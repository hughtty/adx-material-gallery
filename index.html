    </div>
    <div class="kv">
      ${kv('预估曝光量', fmt(d.exposure))}
      ${kv('预估转化量', fmt(d.convert))}
      ${kv('播放数', fmt(d.plays))}
      ${kv('点赞数', fmt(d.likes))}
      ${kv('评论数', fmt(d.comments))}
      ${kv('分享数', fmt(d.shares))}
      ${kv('关联计划数', d.plans)}
      ${kv('投放天数', d.days + ' 天')}
      ${kv('素材时长', fmtDur(d.duration))}
      ${kv('首投日期', d.firstDate)}
      ${kv('最后出现', d.lastDate)}
    </div>
    <div class="urlrow">
      <button onclick="navigator.clipboard.writeText('${d.video}')">复制视频链接</button>
      <a href="${d.video}" target="_blank" style="text-decoration:none"><button class="ghost">新窗口打开</button></a>
      <span style="align-self:center;color:var(--muted);font-size:12px">素材ID：${d.id}</span>
    </div>
    ${sec('投放公司', d.company)}
    ${sec('投放产品', d.product)}
    ${sec('达人', d.talent)}
    <div class="sec"><h3>文案标题（${d.copies.length} 条，可滚动）</h3>
      <ol class="copies" style="max-height:260px;overflow-y:auto">${d.copies.map(c => `<li>${c.replace(/</g,'&lt;')}</li>`).join('')}</ol>
    </div>`;
  $('#mask').classList.add('show');
}
function closeModal() { $('#mask').classList.remove('show'); $('#player').pause(); $('#player').removeAttribute('src'); $('#player').load(); }
function step(n) { if (modalIdx < 0) return; openModal((modalIdx + n + cur.length) % cur.length); }

$('#closeBtn').onclick = closeModal;
$('#mask').onclick = e => { if (e.target === $('#mask')) closeModal(); };
$('#prevBtn').onclick = e => { e.stopPropagation(); step(-1); };
$('#nextBtn').onclick = e => { e.stopPropagation(); step(1); };
document.addEventListener('keydown', e => {
  if (!$('#mask').classList.contains('show')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

render();
</script>
</body>
</html>
